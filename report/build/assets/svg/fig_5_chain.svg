<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" font-family="Raleway, Arial, sans-serif"><rect width="1600" height="560" fill="#ffffff"/><rect x="40" y="60" width="270" height="360" rx="10" fill="#5B6572"/><text x="175" y="112" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Inputs</text><text x="175" y="180" text-anchor="middle" font-size="22" fill="#fff">Wesgro budget and units</text><text x="175" y="220" text-anchor="middle" font-size="22" fill="#fff">Partner budgets</text><text x="175" y="260" text-anchor="middle" font-size="22" fill="#fff">Data from SA Tourism,</text><text x="175" y="300" text-anchor="middle" font-size="22" fill="#fff">ACSA, Stats SA, OTAs</text><polygon points="318,230 344,240 318,250" fill="#5B6572"/><line x1="312" y1="240" x2="324" y2="240" stroke="#5B6572" stroke-width="4"/><rect x="352" y="60" width="270" height="360" rx="10" fill="#1F7A8C"/><text x="487" y="112" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Activities</text><text x="487" y="180" text-anchor="middle" font-size="22" fill="#fff">18 initiatives,</text><text x="487" y="220" text-anchor="middle" font-size="22" fill="#fff">I1 to I18</text><text x="487" y="260" text-anchor="middle" font-size="22" fill="#fff">112 actions by tier</text><text x="487" y="300" text-anchor="middle" font-size="22" fill="#fff">(Chapter 3)</text><polygon points="630,230 656,240 630,250" fill="#5B6572"/><line x1="624" y1="240" x2="636" y2="240" stroke="#5B6572" stroke-width="4"/><rect x="664" y="60" width="270" height="360" rx="10" fill="#7A9E7E"/><text x="799" y="112" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Outputs</text><text x="799" y="180" text-anchor="middle" font-size="22" fill="#fff">36 Tier 3 indicators</text><text x="799" y="220" text-anchor="middle" font-size="22" fill="#fff">Calendar published,</text><text x="799" y="260" text-anchor="middle" font-size="22" fill="#fff">fund constituted,</text><text x="799" y="300" text-anchor="middle" font-size="22" fill="#fff">routes bookable</text><polygon points="942,230 968,240 942,250" fill="#5B6572"/><line x1="936" y1="240" x2="948" y2="240" stroke="#5B6572" stroke-width="4"/><rect x="976" y="60" width="270" height="360" rx="10" fill="#C98B2B"/><text x="1111" y="112" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Outcomes</text><text x="1111" y="180" text-anchor="middle" font-size="22" fill="#fff">25 Tier 2 indicators</text><text x="1111" y="220" text-anchor="middle" font-size="22" fill="#fff">Seats, readiness,</text><text x="1111" y="260" text-anchor="middle" font-size="22" fill="#fff">bookability, hub</text><text x="1111" y="300" text-anchor="middle" font-size="22" fill="#fff">arrivals, pilots</text><polygon points="1254,230 1280,240 1254,250" fill="#5B6572"/><line x1="1248" y1="240" x2="1260" y2="240" stroke="#5B6572" stroke-width="4"/><rect x="1288" y="60" width="270" height="360" rx="10" fill="#0B3C5D"/><text x="1423" y="112" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Impact</text><text x="1423" y="180" text-anchor="middle" font-size="22" fill="#fff">7 Tier 1 indicators</text><text x="1423" y="220" text-anchor="middle" font-size="22" fill="#fff">Arrivals, spend, jobs,</text><text x="1423" y="260" text-anchor="middle" font-size="22" fill="#fff">green season, spread,</text><text x="1423" y="300" text-anchor="middle" font-size="22" fill="#fff">community spend</text><rect x="40" y="460" width="1520" height="70" rx="8" fill="#F3F6F9"/><text x="800" y="503" text-anchor="middle" font-size="22" fill="#1C2431">Wesgro controls the first three columns; outcomes and impact also depend on airlines, national government and the wider economy</text></svg>