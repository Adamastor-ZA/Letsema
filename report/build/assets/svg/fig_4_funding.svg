<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Raleway, Arial, sans-serif"><rect width="1600" height="900" fill="#ffffff"/><text x="440" y="166.75" text-anchor="end" font-size="22" fill="#1C2431">Wesgro operating budget</text><rect x="456" y="128.75" width="964" height="60" fill="#0B3C5D" rx="3"/><text x="1432" y="166.75" font-size="22" font-weight="700" fill="#1C2431">13</text><text x="440" y="364.25" text-anchor="end" font-size="22" fill="#1C2431">Provincial and municipal budgets</text><rect x="456" y="326.25" width="889.8461538461538" height="60" fill="#0B3C5D" rx="3"/><text x="1357.8461538461538" y="364.25" font-size="22" font-weight="700" fill="#1C2431">12</text><text x="440" y="561.75" text-anchor="end" font-size="22" fill="#1C2431">National programmes and SOEs</text><rect x="456" y="523.75" width="222.46153846153845" height="60" fill="#0B3C5D" rx="3"/><text x="690.4615384615385" y="561.75" font-size="22" font-weight="700" fill="#1C2431">3</text><text x="440" y="759.25" text-anchor="end" font-size="22" fill="#1C2431">Private capital</text><rect x="456" y="721.25" width="296.61538461538464" height="60" fill="#0B3C5D" rx="3"/><text x="764.6153846153846" y="759.25" font-size="22" font-weight="700" fill="#1C2431">4</text><g class="callout"><rect x="880" y="500" width="610" height="122" rx="6" fill="#F3F6F9"/><rect x="880" y="500" width="8" height="122" rx="3" fill="#1F7A8C"/><text x="906" y="539" font-size="24" font-weight="700" fill="#0B3C5D">Wesgro's operating budget is the main source</text><text x="906" y="570" font-size="24" font-weight="700" fill="#0B3C5D">for 13 initiatives, and private capital for</text><text x="906" y="601" font-size="24" font-weight="700" fill="#0B3C5D">the four capital-heavy ones.</text></g></svg>