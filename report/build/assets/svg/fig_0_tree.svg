<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1330" width="1600" height="1330" font-family="Raleway, Arial, sans-serif"><rect width="1600" height="1330" fill="#ffffff"/><rect x="40" y="20" width="1520" height="64" rx="6" fill="#0B3C5D"/><text x="800" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Accelerating tourism growth: toward 2.5 million international arrivals by 2035</text><rect x="52" y="104" width="482.6666666666667" height="100" rx="6" fill="#1F7A8C"/><text x="293.33333333333337" y="144" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">1 Reshape demand</text><text x="293.33333333333337" y="180" text-anchor="middle" font-size="20" fill="#ffffff">More segments, markets, months and places</text><rect x="52" y="222" width="482.6666666666667" height="42" rx="4" fill="#DCE6EE"/><text x="64" y="251" font-size="21" font-weight="700" fill="#0B3C5D">1.1 Traveller, brand and proposition</text><rect x="52" y="274" width="482.6666666666667" height="96" rx="4" fill="#ffffff" stroke="#C9D1DA"/><text x="64" y="304" font-size="21" font-weight="700" fill="#1C2431">1</text><text x="104" y="304" font-size="21" fill="#1C2431">Respond to growth segment</text><text x="104" y="330" font-size="21" fill="#1C2431">traveller preferences</text><rect x="104" y="336" width="121" height="26" rx="13" fill="#7A9E7E"/><text x="164.5" y="355" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Validated</text><rect x="52" y="378" width="482.6666666666667" height="96" rx="4" fill="#ffffff" stroke="#C9D1DA"/><text x="64" y="408" font-size="21" font-weight="700" fill="#1C2431">2</text><text x="104" y="408" font-size="21" fill="#1C2431">Create green-season demand</text><text x="104" y="434" font-size="21" fill="#1C2431">with MICE and events</text><rect x="104" y="440" width="110" height="26" rx="13" fill="#C98B2B"/><text x="159" y="459" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Reworded</text