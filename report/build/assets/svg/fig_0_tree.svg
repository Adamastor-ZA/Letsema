<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1154" width="1600" height="1154" font-family="Arial, Helvetica, sans-serif"><rect width="1600" height="1154" fill="#ffffff"/><rect x="40" y="20" width="1520" height="64" rx="8" fill="#4D4D4F"/><text x="800" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Accelerating tourism growth: toward 2.5 million international arrivals by 2035</text><rect x="52" y="104" width="482.6666666666667" height="100" rx="8" fill="#006E93"/><text x="293.33333333333337" y="144" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">1 Reshape demand</text><text x="293.33333333333337" y="180" text-anchor="middle" font-size="20" fill="#ffffff">More segments, markets, months and places</text><rect x="52" y="222" width="482.6666666666667" height="42" rx="6" fill="#E6E7E8"/><text x="64" y="251" font-size="21" font-weight="700" fill="#4D4D4F">1.1 Traveller, brand and proposition</text><rect x="52" y="274" width="482.6666666666667" height="74" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="64" y="304" font-size="21" font-weight="700" fill="#2B2B2D">1</text><text x="104" y="304" font-size="21" fill="#2B2B2D">Respond to growth segment</text><text x="104" y="330" font-size="21" fill="#2B2B2D">traveller preferences</text><rect x="52" y="356" width="482.6666666666667" height="74" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="64" y="386" font-size="21" font-weight="700" fill="#2B2B2D">2</text><text x="104" y="386" font-size="21" fill="#2B2B2D">Create green-season demand</text><text x="104" y="412" font-size="21" fill="#2B2B2D">with MICE and events</text><rect x="52" y="438" width="482.6666666666667" height="74" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="64" y="468" font-size="21" font-weight="700" fill="#2B2B2D">3</text><text x="104" y="468" font-size="21" fill="#2B2B2D">Make the whole province</text><text x="104" y="494" font-size="21" fill="#2B2B2D">findable and bookable</text><rect x="52" y="530" width="482.6666666666667" height="42" rx="6" fill="#E6E7E8"/><text x="64" y="559" font-size="21" font-weight="700" fill="#4D4D4F">1.2 Source market growth</text><rect x="52" y="582" width="482.6666666666667" height="74" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="64" y="612" font-size="21" font-weight="700" fill="#2B2B2D">4</text><text x="104" y="612" font-size="21" fill="#2B2B2D">Convert India and China hub</text><text x="104" y="638" font-size="21" fill="#2B2B2D">traffic</text><rect x="52" y="664" width="482.6666666666667" height="74" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="64" y="694" font-size="21" font-weight="700" fill="#2B2B2D">5</text><text x="104" y="694" font-size="21" fill="#2B2B2D">Increase yield in mature</text><text x="104" y="720" font-size="21" fill="#2B2B2D">markets</text><rect x="52" y="746" width="482.6666666666667" height="74" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="64" y="776" font-size="21" font-weight="700" fill="#2B2B2D">6</text><text x="104" y="776" font-size="21" fill="#2B2B2D">Build a regional foundation</text><text x="104" y="802" font-size="21" fill="#2B2B2D">(Africa)</text><rect x="558.6666666666667" y="104" width="482.6666666666667" height="100" rx="8" fill="#006E93"/><text x="800.0000000000001" y="144" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">2 Transform supply</text><text x="800.0000000000001" y="180" text-anchor="middle" font-size="20" fill="#ffffff">Seats, reach, product and experience</text><rect x="558.6666666666667" y="222" width="482.6666666666667" height="42" rx="6" fill="#E6E7E8"/><text x="570.6666666666667" y="251" font-size="21" font-weight="700" fill="#4D4D4F">2.1 Access and infrastructure</text><rect x="558.6666666666667" y="274" width="482.6666666666667" height="74" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="570.6666666666667" y="304" font-size="21" font-weight="700" fill="#2B2B2D">7</text><text x="610.6666666666667" y="304" font-size="21" fill="#2B2B2D">Win direct routes and add</text><text x="610.6666666666667" y="330" font-size="21" fill="#2B2B2D">seats on full routes</text><rect x="558.6666666666667" y="356" width="482.6666666666667" height="48" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="570.6666666666667" y="386" font-size="21" font-weight="700" fill="#2B2B2D">8</text><text x="610.6666666666667" y="386" font-size="21" fill="#2B2B2D">Grow cruise calls and ports</text><rect x="558.6666666666667" y="412" width="482.6666666666667" height="74" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="570.6666666666667" y="442" font-size="21" font-weight="700" fill="#2B2B2D">9</text><text x="610.6666666666667" y="442" font-size="21" fill="#2B2B2D">Accelerate tourism-enabling</text><text x="610.6666666666667" y="468" font-size="21" fill="#2B2B2D">internal mobility</text><rect x="558.6666666666667" y="504" width="482.6666666666667" height="42" rx="6" fill="#E6E7E8"/><text x="570.6666666666667" y="533" font-size="21" font-weight="700" fill="#4D4D4F">2.2 Product and capacity</text><rect x="558.6666666666667" y="556" width="482.6666666666667" height="74" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="570.6666666666667" y="586" font-size="21" font-weight="700" fill="#2B2B2D">10</text><text x="610.6666666666667" y="586" font-size="21" fill="#2B2B2D">Support diversified route</text><text x="610.6666666666667" y="612" font-size="21" fill="#2B2B2D">and product development</text><rect x="558.6666666666667" y="638" width="482.6666666666667" height="74" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="570.6666666666667" y="668" font-size="21" font-weight="700" fill="#2B2B2D">11</text><text x="610.6666666666667" y="668" font-size="21" fill="#2B2B2D">Align visitor experience</text><text x="610.6666666666667" y="694" font-size="21" fill="#2B2B2D">in-destination</text><rect x="558.6666666666667" y="720" width="482.6666666666667" height="74" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="570.6666666666667" y="750" font-size="21" font-weight="700" fill="#2B2B2D">12</text><text x="610.6666666666667" y="750" font-size="21" fill="#2B2B2D">Balance impact on</text><text x="610.6666666666667" y="776" font-size="21" fill="#2B2B2D">nature-based attractions</text><rect x="1065.3333333333335" y="104" width="482.6666666666667" height="100" rx="8" fill="#006E93"/><text x="1306.6666666666667" y="144" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">3 Build enabling capability</text><text x="1306.6666666666667" y="180" text-anchor="middle" font-size="20" fill="#ffffff">Inclusion, capital, governance and data</text><rect x="1065.3333333333335" y="222" width="482.6666666666667" height="42" rx="6" fill="#E6E7E8"/><text x="1077.3333333333335" y="251" font-size="21" font-weight="700" fill="#4D4D4F">3.1 Inclusion and sustainability</text><rect x="1065.3333333333335" y="274" width="482.6666666666667" height="100" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="1077.3333333333335" y="304" font-size="21" font-weight="700" fill="#2B2B2D">13</text><text x="1117.3333333333335" y="304" font-size="21" fill="#2B2B2D">Embed local destination</text><text x="1117.3333333333335" y="330" font-size="21" fill="#2B2B2D">bodies for community</text><text x="1117.3333333333335" y="356" font-size="21" fill="#2B2B2D">inclusion</text><rect x="1065.3333333333335" y="382" width="482.6666666666667" height="74" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="1077.3333333333335" y="412" font-size="21" font-weight="700" fill="#2B2B2D">14</text><text x="1117.3333333333335" y="412" font-size="21" fill="#2B2B2D">Manage climate risk and</text><text x="1117.3333333333335" y="438" font-size="21" fill="#2B2B2D">sustainable tourism</text><rect x="1065.3333333333335" y="464" width="482.6666666666667" height="100" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="1077.3333333333335" y="494" font-size="21" font-weight="700" fill="#2B2B2D">15</text><text x="1117.3333333333335" y="494" font-size="21" fill="#2B2B2D">Crowd in capital with</text><text x="1117.3333333333335" y="520" font-size="21" fill="#2B2B2D">targeted investment</text><text x="1117.3333333333335" y="546" font-size="21" fill="#2B2B2D">strategies</text><rect x="1065.3333333333335" y="582" width="482.6666666666667" height="42" rx="6" fill="#E6E7E8"/><text x="1077.3333333333335" y="611" font-size="21" font-weight="700" fill="#4D4D4F">3.2 Governance and leadership</text><rect x="1065.3333333333335" y="634" width="482.6666666666667" height="100" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="1077.3333333333335" y="664" font-size="21" font-weight="700" fill="#2B2B2D">16</text><text x="1117.3333333333335" y="664" font-size="21" fill="#2B2B2D">Align institutional</text><text x="1117.3333333333335" y="690" font-size="21" fill="#2B2B2D">stakeholders across all</text><text x="1117.3333333333335" y="716" font-size="21" fill="#2B2B2D">three tiers</text><rect x="1065.3333333333335" y="742" width="482.6666666666667" height="74" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="1077.3333333333335" y="772" font-size="21" font-weight="700" fill="#2B2B2D">17</text><text x="1117.3333333333335" y="772" font-size="21" fill="#2B2B2D">Strengthen industry and</text><text x="1117.3333333333335" y="798" font-size="21" fill="#2B2B2D">government collaboration</text><rect x="1065.3333333333335" y="824" width="482.6666666666667" height="74" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="1077.3333333333335" y="854" font-size="21" font-weight="700" fill="#2B2B2D">18</text><text x="1117.3333333333335" y="854" font-size="21" fill="#2B2B2D">Expedite tourism-enabling</text><text x="1117.3333333333335" y="880" font-size="21" fill="#2B2B2D">policy and data sharing</text><rect x="1065.3333333333335" y="906" width="482.6666666666667" height="100" rx="6" fill="#ffffff" stroke="#D9DADB"/><text x="1077.3333333333335" y="936" font-size="21" font-weight="700" fill="#2B2B2D">19</text><text x="1117.3333333333335" y="936" font-size="21" fill="#2B2B2D">Lead removal of</text><text 