<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Raleway, Arial, sans-serif"><rect width="1600" height="900" fill="#ffffff"/><text x="427" y="124.42857142857143" text-anchor="end" font-size="22" fill="#1C2431">Chile</text><rect x="443" y="86.42857142857143" width="977" height="60" fill="#0B3C5D" rx="3"/><text x="1432" y="124.42857142857143" font-size="22" font-weight="700" fill="#1C2431">40.4%</text><text x="427" y="237.28571428571428" text-anchor="end" font-size="22" fill="#1C2431">Singapore</text><rect x="443" y="199.28571428571428" width="507.84653465346537" height="60" fill="#0B3C5D" rx="3"/><text x="962.8465346534654" y="237.28571428571428" font-size="22" font-weight="700" fill="#1C2431">21.0%</text><text x="427" y="350.14285714285717" text-anchor="end" font-size="22" fill="#1C2431">Kenya</text><rect x="443" y="312.14285714285717" width="353.07425742574264" height="60" fill="#0B3C5D" rx="3"/><text x="808.0742574257426" y="350.14285714285717" font-size="22" font-weight="700" fill="#1C2431">14.6%</text><text x="427" y="463" text-anchor="end" font-size="22" fill="#1C2431">Valencia (range midpoint)</text><rect x="443" y="425" width="326.4727722772277" height="60" fill="#0B3C5D" rx="3"/><text x="781.4727722772277" y="463" font-size="22" font-weight="700" fill="#1C2431">13.5%</text><text x="427" y="575.8571428571429" text-anchor="end" font-size="22" fill="#1C2431">New Zealand (holiday arrivals)</text><rect x="443" y="537.8571428571429" width="290.1980198019802" height="60" fill="#0B3C5D" rx="3"/><text x="745.1980198019802" y="575.8571428571429" font-size="22" font-weight="700" fill="#1C2431">12.0%</text><text x="427" y="688.7142857142858" text-anchor="end" font-size="22" fill="#1C2431">Melbourne (Australian forecast)</text><rect x="443" y="650.7142857142858" width="103.98762376237619" height="60" fill="#0B3C5D" rx="3"/><text x="558.9876237623762" y="688.7142857142858" font-size="22" font-weight="700" fill="#1C2431"