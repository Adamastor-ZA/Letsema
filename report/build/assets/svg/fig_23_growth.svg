<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Arial, Helvetica, sans-serif"><rect width="1600" height="900" fill="#ffffff"/><text x="427" y="124.42857142857143" text-anchor="end" font-size="22" fill="#2B2B2D">Chile</text><rect x="443" y="86.42857142857143" width="977" height="60" fill="#4D4D4F" rx="3"/><text x="1432" y="124.42857142857143" font-size="22" font-weight="700" fill="#2B2B2D">40.4%</text><text x="427" y="237.28571428571428" text-anchor="end" font-size="22" fill="#2B2B2D">Singapore</text><rect x="443" y="199.28571428571428" width="507.84653465346537" height="60" fill="#4D4D4F" rx="3"/><text x="962.8465346534654" y="237.28571428571428" font-size="22" font-weight="700" fill="#2B2B2D">21.0%</text><text x="427" y="350.14285714285717" text-anchor="end" font-size="22" fill="#2B2B2D">Kenya</text><rect x="443" y="312.14285714285717" width="353.07425742574264" height="60" fill="#4D4D4F" rx="3"/><text x="808.0742574257426" y="350.14285714285717" font-size="22" font-weight="700" fill="#2B2B2D">14.6%</text><text x="427" y="463" text-anchor="end" font-size="22" fill="#2B2B2D">Valencia (range midpoint)</text><rect x="443" y="425" width="326.4727722772277" height="60" fill="#4D4D4F" rx="3"/><text x="781.4727722772277" y="463" font-size="22" font-weight="700" fill="#2B2B2D">13.5%</text><text x="427" y="575.8571428571429" text-anchor="end" font-size="22" fill="#2B2B2D">New Zealand (holiday arrivals)</text><rect x="443" y="537.8571428571429" width="290.1980198019802" height="60" fill="#4D4D4F" rx="3"/><text x="745.1980198019802" y="575.8571428571429" font-size="22" font-weight="700" fill="#2B2B2D">12.0%</text><text x="427" y="688.7142857142858" text-anchor="end" font-size="22" fill="#2B2B2D">Melbourne (Australian forecast)</text><rect x="443" y="650.7142857142858" width="103.98762376237619" height="60" fill="#4D4D4F" rx="3"/><text x="558.9876237623762" y="688.7142857142858" font-size="22" font-weight="700" fill="#2B2B2D">4.3%</text><text x="427" y="801.5714285714286" text-anchor="end" font-size="22" fill="#2B2B2D">World, 2024 (UN Tourism)</text><rect x="443" y="763.5714285714286" width="266.0148514851485" height="60" fill="#00A3DA" rx="3"/><text x="721.0148514851485" y="801.5714285714286" font-size="22" font-weight="700" fill="#2B2B2D">11.0%</text><text x="40" y="886" font-size="18" fill="#6D6E71">The report's global norm is 3% to 5% a year; above 5% marks structural acceleration (p7).</text><g class="callout"><rect x="930" y="330" width="585" height="122" rx="6" fill="#F5F6F7"/><rect x="930" y="330" width="8" height="122" rx="3" fill="#00A3DA"/><text x="956" y="369" font-size="24" font-weight="700" fill="#4D4D4F">Chile and Singapore grew two to four times</text><text x="956" y="400" font-size="24" font-weight="700" fill="#4D4D4F">the world's 11%; Kenya, Valencia and New</text><text x="956" y="431" font-size="24" font-weight="700" fill="#4D4D4F">Zealand slightly faster.</text></g></svg>